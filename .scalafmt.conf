preset = defaultWithAlign
//@formatter on
version = 3.11.5
runner.dialect = scala3
align.preset = more
danglingParentheses.preset = true
docstrings.style = Asterisk
indentOperator.preset = spray
maxColumn = 120
rewrite.rules = [RedundantBraces, RedundantParens, SortImports]
// Check every source file sbt knows about, not just git-tracked ones: with project.git = true a
// newly created file is invisible to scalafmtCheckAll until its first commit, so the local gate
// passes and CI (which checks out everything as tracked) fails.
project.git = false
