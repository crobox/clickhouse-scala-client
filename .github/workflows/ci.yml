name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  # Only the default branch: a pull_request event already covers every other branch, and running both meant the whole
  # matrix twice per commit. With several PRs open that was enough concurrent dependency resolution to get rate-limited
  # by Maven Central (HTTP 429).
  push:
    branches: [main]

concurrency:
  # A superseded run is six jobs, each starting a ClickHouse container, so cancel it. Not on main, where every commit's
  # result is worth keeping.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        scala: [2.13.18, 3.3.8]
        # The last three ClickHouse LTS releases. LTS ships twice a year, as the .3 and .8 releases, so this list
        # moves forward roughly every six months.
        clickhouse: [25.3, 25.8, 26.3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Update '/etc/hosts' file
        run: ./.docker/update-hosts.sh

      - name: Generate SSL certificates
        run: ./.docker/generate-certs.sh

      - name: Docker Compose Action
        uses: hoverkraft-tech/compose-action@v3
        env:
          CLICKHOUSE_VERSION: ${{ matrix.clickhouse }}
        with:
          compose-file: './.docker/docker-compose.yml'
          down-flags: '--volumes'

      - name: Check formatting
        run: sbt ++${{ matrix.scala }} scalafmtCheckAll scalafmtSbtCheck

      - name: Build project
        run: sbt ++${{ matrix.scala }} test IntegrationTest/test

