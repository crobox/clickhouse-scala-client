name: Release
on:
  push:
    tags: ["*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1

      # The stored signing key has expired and its private half is lost, so push the
      # expiry forward in this runner's keyring before anything tries to sign.
      - uses: ./.github/actions/refresh-signing-key
        with:
          pgp-secret: ${{ secrets.PGP_SECRET }}
          pgp-passphrase: ${{ secrets.PGP_PASSPHRASE }}

      # No ClickHouse here: `ci-release` cross-builds, signs and publishes, and runs no tests. The v1.3.0 release log
      # confirms it -- zero tests executed, and the only output was POMs, API docs and uploads. Bringing up a server,
      # generating certificates and patching /etc/hosts added minutes and three failure surfaces to every release for
      # nothing. Testing happens in ci.yml, before the tag.
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
