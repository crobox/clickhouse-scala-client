name: Release
on:
  push:
    tags: ["*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1

      # The stored signing key has expired and its private half is lost, so push the
      # expiry forward in this runner's keyring before anything tries to sign. Runs
      # before the docker steps so a broken key fails in seconds, not minutes.
      - uses: ./.github/actions/refresh-signing-key
        with:
          pgp-secret: ${{ secrets.PGP_SECRET }}
          pgp-passphrase: ${{ secrets.PGP_PASSPHRASE }}
      - name: Update '/etc/hosts' file
        run: ./.docker/update-hosts.sh

      - name: Generate SSL certificates
        run: ./.docker/generate-certs.sh

      - name: Docker Compose Action
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: './.docker/docker-compose.yml'
          down-flags: '--volumes'
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
